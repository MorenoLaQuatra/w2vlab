data:
  corpus: scnwiki.txt
  max_tokens: -1  # -1 = all; use a positive limit for large dumps
  min_count: 3
  max_words: 20000
  window: 4

model:
  type: word2vec # word2vec or fasttext
  architecture: cbow # skipgram or cbow
  dimensions: 100
  loss: negative # negative or softmax
  negatives: 10
  min_n: 3 # fasttext character n-grams
  max_n: 6

training:
  epochs: 20
  batch_size: 1024
  lr: 0.005
  seed: 1

output: vectors.pt
